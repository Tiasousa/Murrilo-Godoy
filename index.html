<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gabinete Digital - Vereador Murillo Godoy</title>
  <!-- Ícone da tela inicial (arquivo icon-192.png na MESMA pasta) -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="shortcut icon" href="icon-192.png">
  <!-- Nome do app + tela cheia + cor do tema -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gabinete Digital">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Gabinete Digital">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1A33">
  <style>
    html, body { margin: 0; height: 100%; background: #0A1A33; }
    /* respeita a faixa de cima do iPhone (relógio/notch) em tela cheia */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: 0;
    }
    #abrindo {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 15% 10%, rgba(60,110,220,.35) 0%, transparent 45%),
                  radial-gradient(circle at 85% 25%, rgba(60,110,220,.25) 0%, transparent 40%),
                  linear-gradient(180deg, #0B1A33 0%, #060B18 100%);
      color: #EAF1FB; font-family: 'Segoe UI', system-ui, sans-serif; z-index: 2;
      transition: opacity .5s ease;
    }
    #abrindo img { width: 140px; height: auto; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    #abrindo .marca { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    #abrindo .marca .gabinete { color: #ffffff; }
    #abrindo .marca .digital { color: #C1272D; }
    #abrindo .sub { font-size: 11px; letter-spacing: 2.5px; color: #8b93aa; }
    #abrindo .anel { width: 36px; height: 36px; border: 3px solid rgba(37,99,235,.25); border-top-color: #2563EB; border-radius: 50%; animation: girar .9s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    #abrindo a { margin-top: 8px; color: #9fb6d6; font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="abrindo">
    <img src="icon-192.png" alt="Gabinete Digital" onerror="this.style.display='none'">
    <div class="marca"><span class="gabinete">GABINETE</span> <span class="digital">DIGITAL</span></div>
    <div class="sub">VEREADOR MURILLO GODOY</div>
    <div class="anel"></div>
    <a href="https://script.google.com/macros/s/AKfycbwqxDctgqrvwpgGvMbsQLKLjYFB4HGWLCmJD4H1e7MxOIMrNjFSwBgKntRgPwwLADE9kg/exec" target="_blank">Não abriu? Toque aqui</a>
  </div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbwqxDctgqrvwpgGvMbsQLKLjYFB4HGWLCmJD4H1e7MxOIMrNjFSwBgKntRgPwwLADE9kg/exec"
    onload="document.getElementById('abrindo').style.opacity='0'; setTimeout(function(){document.getElementById('abrindo').style.display='none';}, 600);"></iframe>
</body>
</html>
